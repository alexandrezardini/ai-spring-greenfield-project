<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset your StreamTube password</title>
</head>
<body style="font-family:sans-serif;color:#333;">
    <p>Hi <span th:text="${name}"></span>,</p>
    <p>We received a request to reset your StreamTube password. Click the link below to set a new password:</p>
    <p><a th:href="${resetLink}" style="color:#1a73e8;font-weight:bold;">Reset your password</a></p>
    <p style="color:#777;font-size:0.9em;">If you didn't request a password reset, you can safely ignore this email.</p>
</body>
</html>
